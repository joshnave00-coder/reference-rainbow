name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q bibledb rainbow tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Data bundles are present
        run: |
          test -s rainbow/data.js
          test -s rainbow/echoes-data.js
